spring:
  application:
    name: skhu-connect

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: always
  health:
    diskspace:
      threshold: 5GB

app:
  fcm:
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  mail:
    resend-api-key: ${RESEND_API_KEY}
    from: ${MAIL_FROM}
  jwt:
    secret: ${JWT_SECRET}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}

  openai:
    api-key: ${OPENAI_API_KEY:}
    embedding-model: text-embedding-3-small
    embedding-dimensions: 256
  petition:
    similarity:
      threshold: ${PETITION_SIMILARITY_THRESHOLD:0.75}
      search-limit: ${PETITION_SIMILARITY_SEARCH_LIMIT:3}
      search-window: ${PETITION_SIMILARITY_SEARCH_WINDOW:10m}
