spring:
  application:
    name: skhu-connect

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  fcm:
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  mail:
    resend-api-key: ${RESEND_API_KEY}
    from: ${MAIL_FROM}
  jwt:
    secret: ${JWT_SECRET}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}
